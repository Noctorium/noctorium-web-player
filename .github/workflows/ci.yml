name: CI

# The page type-checks and builds, both ways: as noctorium web serves it (shipped inside Noctorium-cli, which
# builds it again from the commit its web/ submodule pins) and as the hosted player, with its API.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:hosted
